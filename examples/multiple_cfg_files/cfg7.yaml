logs: no

loading:
  folder: "C:/Users/guilh/Documents/Projets_Code/yaml-ML/datasets"
  name: "insurance_charges"
  format: 'csv'
  separator: ','

target_var: 'charges'

preprocessing:
  charges:
    type: "cont"
    cleaning: ['remove_nans', 'remove_outliers']
    replace_nans: 'mean'
  age:
    type: "cont"
    cleaning: ['remove_nans', 'remove_outliers']
    replace_nans: 'median'
    scaling: 'robust'
  sex:
    type: "cat"
    cleaning: 'remove_nans'
    encoding: 'binary'
  region:
    type: "cat"
    cleaning: 'remove_nans'
    encoding: 'one_hot'
  bmi:
    type: "cont"
    cleaning: ['remove_nans', 'remove_outliers']
    scaling: 'standard'
  children:
    type: "cont"
    cleaning: 'remove_nans'
  smoker:
    type: "cat"
    cleaning: 'remove_nans'
    encoding: 'ordinal'

dataset:
  split:
    stratified: no
    train: 80
    test: 20
    val: 10

model:
  regression:
    svr:
      kernel: 'rbf'
      C: 10
      epsilon: 0.1

score: ['r2', 'mae', 'r2', 'mape', 'rmse']

output_folder: "C:/Users/guilh/Documents/Projets_Code/yaml-ML/out/multiple"
name: "cfg7"