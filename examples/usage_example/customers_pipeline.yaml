# Pipeline Logs Information ----------------------------------------
name: "CustomersPipeline"
output_folder: "./CustomersPipeline_outputs"
logs: yes

# Loading Dataset -------------------------------------------------
loading:
  folder: "path/to/dataset/folder"  # change it to the actual path to the folder in your machine
  name: "customers"
  format: 'csv'
  separator: ','

# Target Variable -------------------------------------------------
target_var: 'SpendingScore'

# Data Preprocessing Pipeline -------------------------------------
preprocessing:
  CustomerID:
    type: "cont"
    cleaning: 'remove_col'
  SpendingScore:
    type: "cont"
    cleaning: 'remove_nans'
  Gender:
    type: "cat"
    cleaning: 'remove_nans'
    encoding: 'binary'
  Age:
    type: "cont"
    cleaning: 'remove_nans'
    scaling: 'robust'
  AnnualIncome:
    type: "cont"
    cleaning: 'remove_outliers'
    replace_nans: 'median'
    scaling: 'standard'
  Profession:
    type: "cat"
    cleaning: 'remove_nans'
    encoding: 'one_hot'
  WorkExperience:
    type: "cont"
    cleaning: 'remove_nans'
    scaling: 'abs_max'
  FamilySize:
    type: "cont"
    cleaning: ['remove_nans', 'remove_outliers']
    scaling: 'min_max'

# Train-Test split ------------------------------------------------
dataset:
  split:
    train: 80

# Model Definition ------------------------------------------------
model:
  regression:
    lasso:
      alpha: 0.1
      fit_intercept: yes

# Evaluation Scores -----------------------------------------------
score: ['r2', 'rmse', 'mae']
