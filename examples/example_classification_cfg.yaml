logs: no

loading:
  folder: "path/to/dataset/folder"  # change it to the actual path to the folder in your machine
  name: "iris"
  format: 'csv'
  separator: ','

target_var: 'Species'

preprocessing:
  Id:
    type: "cont"
    cleaning: 'remove_col'
  Species:
    type: "cat"
    cleaning: 'remove_nans'
  SepalLengthCm:
    type: "cont"
    cleaning: ['remove_nans', 'remove_outliers' ]
    replace_nans: 'median'
    scaling: 'robust'
  SepalWidthCm:
    type: "cont"
    cleaning: ['remove_nans', 'remove_outliers' ]
    replace_nans: 'median'
    scaling: 'robust'
  PetalLengthCm:
    type: "cont"
    cleaning: ['remove_nans', 'remove_outliers' ]
    replace_nans: 'median'
    scaling: 'robust'
  PetalWidthCm:
    type: "cont"
    cleaning: ['remove_nans', 'remove_outliers' ]
    replace_nans: 'median'
    scaling: 'robust'

dataset:
  split:
    stratified: no
    train: 80
    test: 20
    val: 10

model:
  classification:
#    catboost:
#      iterations: 500
#      depth: 6
#      learning_rate: 0.1
#    lgbm:
#      max_depth: 4
#      learning_rate: 0.1
#      n_estimators: 100
    random_forest:
      n_estimators: 100
      criterion: 'gini'
      min_samples_split: 2
      min_samples_leaf: 1

score: ['f1', 'accuracy', 'cross_entropy', 'recall', 'precision']
#score: 'auc'  # todo: debug `ValueError: multi_class must be in ('ovo', 'ovr')`

output_folder: "C:/Users/guilh/Documents/Projets_Code/yaml-ML/out"
name: "classification_example"