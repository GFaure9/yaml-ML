name: "reg_mlp"
output_folder: "./out_parallel"
logs: no

loading:
  folder: "./tests_datasets"
  name: "test_dataset_regression_comma"
  format: 'csv'
  separator: ','

target_var: "y"
preprocessing:
  y:
    type: "cont"
    cleaning: [ 'remove_nans', 'remove_outliers' ]
    scaling: 'min_max'
  x1:
    type: "cat"
    cleaning: [ 'remove_nans' ]
    encoding: 'binary'
  x2:
    type: "cat"
    replace_nans: 'most_frequent'
    encoding: 'ordinal'
  x3:
    type: "cont"
    cleaning: [ 'remove_outliers' ]
    replace_nans: {"value": 0.5}
    scaling: 'abs_max'

dataset:
  split:
    stratified: no
    train: 80

model:
  regression:
    mlp:
      hidden_layer_sizes: 100
      activation: "relu"
      solver: "adam"
      alpha: 0.0001
      batch_size: "auto"
      learning_rate: "constant"
      learning_rate_init: 0.001
      power_t: 0.5
      max_iter: 200
      shuffle: True
      random_state: 42
      tol: 0.0001
      verbose: False
      warm_start: False
      momentum: 0.9
      nesterovs_momentum: True
      early_stopping: False
      validation_fraction: 0.1
      beta_1: 0.9
      beta_2: 0.999
      epsilon: 0.000001
      n_iter_no_change: 10
      max_fun: 15000

score: ['r2', 'mae', 'mape', 'rmse']