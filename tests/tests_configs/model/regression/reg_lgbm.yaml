name: "reg_lgbm"
output_folder: "."
logs: no

loading:
  folder: "./tests_datasets"
  name: "test_dataset_regression_comma"
  format: 'csv'
  separator: ','

target_var: "y"
preprocessing:
  y:
    type: "cont"
    cleaning: [ 'remove_nans', 'remove_outliers' ]
    scaling: 'min_max'
  x1:
    type: "cat"
    cleaning: [ 'remove_nans' ]
    encoding: 'binary'
  x2:
    type: "cat"
    replace_nans: 'most_frequent'
    encoding: 'ordinal'
  x3:
    type: "cont"
    cleaning: [ 'remove_outliers' ]
    replace_nans: {"value": 0.5}
    scaling: 'abs_max'

dataset:
  split:
    stratified: no
    train: 80

model:
  regression:
    lgbm:
      boosting_type: "gbdt"
      num_leaves: 31
      max_depth: -1
      learning_rate: 0.1
      n_estimators: 100
      subsample_for_bin: 200000
      min_split_gain: 0.0
      min_child_weight: 1e-3
      min_child_samples: 20
      subsample: 1.0
      subsample_freq: 0
      colsample_bytree: 1.0
      reg_alpha: 0.0
      reg_lambda: 0.0
      random_state: 42
      n_jobs: -1
      importance_type: "split"

score: ['r2', 'mae', 'mape', 'rmse']