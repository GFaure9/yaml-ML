name: "reg_ridge"
output_folder: "."
logs: no

loading:
  folder: "./tests_datasets"
  name: "test_dataset_regression_comma"
  format: 'csv'
  separator: ','

target_var: "y"
preprocessing:
  y:
    type: "cont"
    cleaning: [ 'remove_nans', 'remove_outliers' ]
    scaling: 'min_max'
  x1:
    type: "cat"
    cleaning: [ 'remove_nans' ]
    encoding: 'binary'
  x2:
    type: "cat"
    replace_nans: 'most_frequent'
    encoding: 'ordinal'
  x3:
    type: "cont"
    cleaning: [ 'remove_outliers' ]
    replace_nans: {"value": 0.5}
    scaling: 'abs_max'

dataset:
  split:
    stratified: no
    train: 80

model:
  regression:
    ridge:
      alpha: 1.0
      solver: "auto"

score: ['r2', 'mae', 'mape', 'rmse']