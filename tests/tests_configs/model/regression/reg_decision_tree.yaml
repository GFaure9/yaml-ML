name: "reg_decision_tree"
output_folder: "."
logs: no

loading:
  folder: "./tests_datasets"
  name: "test_dataset_regression_comma"
  format: 'csv'
  separator: ','

target_var: "y"
preprocessing:
  y:
    type: "cont"
    cleaning: [ 'remove_nans', 'remove_outliers' ]
    scaling: 'min_max'
  x1:
    type: "cat"
    cleaning: [ 'remove_nans' ]
    encoding: 'binary'
  x2:
    type: "cat"
    replace_nans: 'most_frequent'
    encoding: 'ordinal'
  x3:
    type: "cont"
    cleaning: [ 'remove_outliers' ]
    replace_nans: {"value": 0.5}
    scaling: 'abs_max'

dataset:
  split:
    stratified: no
    train: 80

model:
  regression:
    decision_tree:
      criterion: "friedman_mse"
      splitter: "best"
      max_depth: 10
      min_samples_split: 2
      min_samples_leaf: 1
      min_weight_fraction_leaf: 0.0
      max_features: 100
      random_state: 42
      max_leaf_nodes: 1000
      min_impurity_decrease: 0.0
      ccp_alpha: 0.0

score: ['r2', 'mae', 'mape', 'rmse']