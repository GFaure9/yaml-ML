name: "reg_catboost"
output_folder: "."
logs: no

loading:
  folder: "./tests_datasets"
  name: "test_dataset_regression_comma"
  format: 'csv'
  separator: ','

target_var: "y"
preprocessing:
  y:
    type: "cont"
    cleaning: [ 'remove_nans', 'remove_outliers' ]
    scaling: 'min_max'
  x1:
    type: "cat"
    cleaning: [ 'remove_nans' ]
    encoding: 'binary'
  x2:
    type: "cat"
    replace_nans: 'most_frequent'
    encoding: 'ordinal'
  x3:
    type: "cont"
    cleaning: [ 'remove_outliers' ]
    replace_nans: {"value": 0.5}
    scaling: 'abs_max'

dataset:
  split:
    stratified: no
    train: 80

model:
  regression:
    catboost:
      iterations: 1000
      learning_rate: 0.03
      depth: 6
      l2_leaf_reg: 3.0
      loss_function: "RMSE"
      boosting_type: "Plain"
      bootstrap_type: "Bayesian"
      random_seed: 42

score: ['r2', 'mae', 'mape', 'rmse']