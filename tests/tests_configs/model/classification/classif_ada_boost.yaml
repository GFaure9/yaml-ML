name: "classif_ada_boost"
output_folder: "."
logs: no

loading:
  folder: "./tests_datasets"
  name: "test_dataset_classification_comma"
  format: 'csv'
  separator: ','

target_var: "y"
preprocessing:
  y:
    type: "cat"
    cleaning: [ 'remove_nans' ]
  x1:
    type: "cat"
    cleaning: [ 'remove_nans' ]
    encoding: 'binary'
  x2:
    type: "cat"
    replace_nans: 'most_frequent'
    encoding: 'ordinal'
  x3:
    type: "cont"
    cleaning: [ 'remove_outliers' ]
    replace_nans: {"value": 0.5}
    scaling: 'abs_max'
  x4:
    type: "cont"
    cleaning: [ 'remove_nans', 'remove_outliers' ]
    scaling: 'min_max'

dataset:
  split:
    stratified: no
    train: 80

model:
  classification:
    ada_boost:
      n_estimators: 50
      learning_rate: 1.0
      algorithm: "SAMME.R"
      random_state: 42

score: ['f1', 'accuracy', 'cross_entropy', 'recall', 'precision']