name: "classif_gradient_boosting"
output_folder: "."
logs: no

loading:
  folder: "./tests_datasets"
  name: "test_dataset_classification_comma"
  format: 'csv'
  separator: ','

target_var: "y"
preprocessing:
  y:
    type: "cat"
    cleaning: [ 'remove_nans' ]
  x1:
    type: "cat"
    cleaning: [ 'remove_nans' ]
    encoding: 'binary'
  x2:
    type: "cat"
    replace_nans: 'most_frequent'
    encoding: 'ordinal'
  x3:
    type: "cont"
    cleaning: [ 'remove_outliers' ]
    replace_nans: {"value": 0.5}
    scaling: 'abs_max'
  x4:
    type: "cont"
    cleaning: [ 'remove_nans', 'remove_outliers' ]
    scaling: 'min_max'

dataset:
  split:
    stratified: no
    train: 80

model:
  classification:
    gradient_boosting:
      loss: "log_loss"
      learning_rate: 0.1
      n_estimators: 100
      subsample: 1.0
      criterion: "friedman_mse"
      min_samples_split: 2
      min_samples_leaf: 1
      min_weight_fraction_leaf: 0.0
      max_depth: 3
      min_impurity_decrease: 0.0
      random_state: 42
      max_features: 100
      verbose: 0
      max_leaf_nodes: 1000
      warm_start: False
      validation_fraction: 0.1
      tol: 0.0001
      ccp_alpha: 0.0

score: ['f1', 'accuracy', 'cross_entropy', 'recall', 'precision']