name: "prepro1"
output_folder: "."
logs: no

loading:
  folder: "./tests_datasets"
  name: "test_dataset_regression_comma"
  format: 'csv'
  separator: ','

target_var: "y"
preprocessing:
  y:
    type: "cont"
    cleaning: [ 'remove_nans', 'remove_outliers' ]
    scaling: 'min_max'
  x1:
    type: "cat"
    replace_nans: {"value": 0.0}
    encoding: 'binary'
  x2:
    type: "cat"
    replace_nans: 'most_frequent'
    encoding: 'ordinal'
  x3:
    type: "cont"
    cleaning: [ 'remove_outliers' ]
    replace_nans: {"value": 0.5}
    scaling: 'abs_max'

dataset:
  split:
model:
score: